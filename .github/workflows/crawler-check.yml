name: EECS 440 Linter

on: [push, pull_request]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  crawler-build:
    name: Build crawler with Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checking out repo
        uses: actions/checkout@v2
      - name: Run make
        run: make -C src/crawler