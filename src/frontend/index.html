  <meta name="description" content="A modern search engine">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta property="og:title" content="">

  <!-- CSS  -->

<body>

  <!-- Main page content -->
  <main>
    <div class="section no-pad-bot" id="index-banner">
      <div class="container">
        <br><br>

        <img class="center scooble-logo" src="img/logo/IMG_0756.png">

        <div id="search-bar">
          <div class="row center">
            <form id="search-form" class="col s12">
              <div class="row">
                <div class="input-field col s12">
                  <i class="material-icons prefix">search</i>
                  <textarea id="icon_prefix2" name="query" required="" aria-required="true" class="materialize-textarea"></textarea>
                  <label for="icon_prefix2">What's on your mind?</label>
                </div>
              </div>
              <div class="row center">
                <button id="search-btn" class="btn-large waves-effect waves-light purple darken-3 submitbtn" type="submit">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Search results - hidden by default -->
    <div id="search-results" class="collection container" hidden>
    </div>

  </main>

  <!-- Footer -->
  <footer id="about" class="page-footer purple darken-4">
